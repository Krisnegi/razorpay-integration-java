server:
  port: ${PORT:5005}
  error:
    include-message: always

spring:
  application:
    name: razorpay-integration-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/razorpay_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_change_in_production_super_secret_jwt_key_change_in_production}
    expiration-ms: 604800000 # 7 days in milliseconds

# Razorpay Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_yourKeyId}
  key-secret: ${RAZORPAY_KEY_SECRET:yourKeySecret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:yourWebhookSecret}

# Meta WhatsApp Configuration
meta:
  access-token: ${META_ACCESS_TOKEN:your_meta_access_token}
  phone-number-id: ${META_PHONE_NUMBER_ID:your_whatsapp_phone_number_id}

logging:
  level:
    root: INFO
    com.razorpay.integration: DEBUG
    org.hibernate.SQL: DEBUG
