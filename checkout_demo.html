<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Razorpay Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
    }
    h2 { margin-top: 0; color: #38bdf8; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .log-box {
      margin-top: 1.5rem;
      background: #090d16;
      padding: 1rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #38bdf8;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Razorpay Test Checkout</h2>
  
  <div class="form-group">
    <label>Amount (₹)</label>
    <input type="number" id="amount" value="500" />
  </div>

  <div class="form-group">
    <label>Payment Method</label>
    <select id="method">
      <option value="UPI">UPI</option>
      <option value="CARD">Credit / Debit Card</option>
      <option value="NETBANKING">Net Banking</option>
      <option value="WALLET">Wallet</option>
      <option value="COD">Cash on Delivery (COD)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Customer Email</label>
    <input type="email" id="email" value="testuser@example.com" />
  </div>

  <button id="createOrderBtn">1. Create Order</button>
  <button id="payBtn" style="display:none; background:#16a34a;">2. Pay with Razorpay Checkout</button>

  <div class="log-box" id="logs">Ready to test...</div>
</div>

<script>
  let currentOrder = null;
  const API_BASE = 'http://localhost:5005/api/payments';

  function log(msg) {
    const logs = document.getElementById('logs');
    logs.innerText += '\n' + msg;
    logs.scrollTop = logs.scrollHeight;
  }

  document.getElementById('createOrderBtn').addEventListener('click', async () => {
    const amount = parseFloat(document.getElementById('amount').value);
    const method = document.getElementById('method').value;
    const customerEmail = document.getElementById('email').value;

    log(`Creating ${method} order for ₹${amount}...`);

    try {
      const res = await fetch(`${API_BASE}/order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, currency: 'INR', method, customerEmail })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Failed to create order');

      currentOrder = data.data;
      log(`Order Created! Order ID: ${currentOrder.orderId}`);

      if (method === 'COD') {
        log(`COD Order placed successfully! No Checkout modal needed.`);
        document.getElementById('payBtn').style.display = 'none';
      } else {
        document.getElementById('payBtn').style.display = 'block';
      }
    } catch (err) {
      log(`Error: ${err.message}`);
    }
  });

  document.getElementById('payBtn').addEventListener('click', () => {
    if (!currentOrder) return log('No active order found.');

    const methodVal = document.getElementById('method').value;

    const options = {
      key: currentOrder.keyId,
      amount: currentOrder.amount, // in paise
      currency: currentOrder.currency,
      name: "Resume Demo Store",
      description: "Test Transaction",
      order_id: currentOrder.orderId,
      handler: async function (response) {
        log(`Payment Completed on Client! Verifying signature...`);
        log(`Payment ID: ${response.razorpay_payment_id}`);

        try {
          const verifyRes = await fetch(`${API_BASE}/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyData.message);

          log(`Verification SUCCESS! Status: CAPTURED`);
        } catch (err) {
          log(`Verification Failed: ${err.message}`);
        }
      },
      prefill: {
        email: document.getElementById('email').value,
        contact: "9876543210"
      },
      theme: { color: "#38bdf8" }
    };

    if (methodVal === 'UPI') {
      options.method = 'upi';
    } else if (methodVal === 'CARD') {
      options.method = 'card';
    } else if (methodVal === 'NETBANKING') {
      options.method = 'netbanking';
    } else if (methodVal === 'WALLET') {
      options.method = 'wallet';
    }

    const rzp = new Razorpay(options);
    rzp.open();
  });
</script>

</body>
</html>
